services:
  worker-test-postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: worker_test
      POSTGRES_PASSWORD: worker_test
      POSTGRES_DB: worker_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U worker_test -d worker_test']
      interval: 2s
      timeout: 3s
      retries: 20

  worker-test-redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6380:6379'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20

name: Worker CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: worker-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build, unit tests, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://worker_test:worker_test@127.0.0.1:5432/worker_test
      REDIS_URL: redis://127.0.0.1:6379/15
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1
      SMTP_USER: ci
      SMTP_PASS: ci
      EMAIL_FROM: ci@worker.test
      CLIENT_URL: http://127.0.0.1:8081
      CLOUDINARY_CLOUD_NAME: ci
      CLOUDINARY_API_KEY: ci
      CLOUDINARY_API_SECRET: ci
      SUBSCRIPTIONS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  integration:
    name: PostgreSQL, Redis, concurrency, and Socket.IO integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: worker_test
          POSTGRES_PASSWORD: worker_test
          POSTGRES_DB: worker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worker_test -d worker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://worker_test:worker_test@127.0.0.1:5432/worker_test
      REDIS_URL: redis://127.0.0.1:6379/15
      JWT_ACCESS_SECRET: ci-integration-access-secret-32-characters
      JWT_REFRESH_SECRET: ci-integration-refresh-secret-32-characters
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 10
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1
      SMTP_USER: ci
      SMTP_PASS: ci
      EMAIL_FROM: integration@worker.test
      CLIENT_URL: http://127.0.0.1:8081
      SUBSCRIPTIONS_ENABLED: 'false'
      WORKER_FREE_ACCEPTED_REQUEST_LIMIT: 20
      MAX_OFFERS_PER_REQUEST: 5
      CLOUDINARY_CLOUD_NAME: ci
      CLOUDINARY_API_KEY: ci
      CLOUDINARY_API_SECRET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:integration

  mobile:
    name: Mobile TypeScript, localization, and Expo compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: https://worker-auth.onrender.com/api/v1
      EXPO_PUBLIC_SOCKET_URL: https://worker-auth.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npx expo install --check
      - run: npx --yes expo-doctor
